# ─────────────────────────────────────────────────────────────
# docker-compose.coolify.yml — Alternative deployment mode
# Use this ONLY if you deploy in Coolify as type "Docker Compose"
# (recommended approach: type "Application" with the Dockerfile).
# ─────────────────────────────────────────────────────────────

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - TZ=Europe/Madrid
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - NEXT_PUBLIC_URL=${NEXT_PUBLIC_URL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM}
    volumes:
      - uploads_public:/app/public/uploads
      - uploads_private:/app/private-uploads
    depends_on:
      db:
        condition: service_healthy
    # Coolify reads these labels to wire up Traefik + SSL automatically
    labels:
      - coolify.managed=true
      - coolify.type=application
      - coolify.name=kikovargas-app

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-kikovargas}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=C.UTF-8
      - TZ=Europe/Madrid
      - PGTZ=Europe/Madrid
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-kikovargas}"]
      interval: 5s
      timeout: 5s
      retries: 10
    labels:
      - coolify.managed=true
      - coolify.type=database
      - coolify.name=kikovargas-db

volumes:
  uploads_public:
  uploads_private:
  db_data:
